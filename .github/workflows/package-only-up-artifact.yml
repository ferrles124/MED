name: Package Only Up Skybound Artifact

on:
  workflow_dispatch:
  push:
    paths:
      - "only_up_skybound_v18/**"
      - ".github/workflows/package-only-up-artifact.yml"

permissions:
  contents: read

jobs:
  package-game:
    name: Zip Only Up Skybound v18
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create ZIP package
        shell: bash
        run: |
          set -euo pipefail
          rm -rf artifact
          mkdir -p artifact
          zip -qr "artifact/only_up_skybound_v18.zip" "only_up_skybound_v18" \
            -x "only_up_skybound_v18/.godot/*"
          unzip -t "artifact/only_up_skybound_v18.zip" >/dev/null
          ls -lh "artifact/only_up_skybound_v18.zip"

      - name: Upload ZIP as GitHub Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: only-up-skybound-v18
          path: artifact/only_up_skybound_v18.zip
          if-no-files-found: error
          retention-days: 30
